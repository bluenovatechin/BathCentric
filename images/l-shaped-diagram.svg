<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F9F9F8"/>
  <!-- Back and Left Corner Walls -->
  <line x1="30" y1="30" x2="30" y2="170" stroke="#718096" stroke-width="8"/>
  <line x1="30" y1="30" x2="270" y2="30" stroke="#718096" stroke-width="8"/>
  <text x="45" y="24" font-family="sans-serif" font-size="10" fill="#718096" font-weight="600">CORNER WALLS 90°</text>
  <!-- Front Panel -->
  <line x1="30" y1="150" x2="190" y2="150" stroke="#0F1113" stroke-width="4"/>
  <!-- Corner Return Panel -->
  <line x1="190" y1="150" x2="190" y2="30" stroke="#0F1113" stroke-width="4"/>
  <!-- Corner Connector -->
  <circle cx="190" cy="150" r="6" fill="#C5A880"/>
  <!-- Swing Door on front -->
  <path d="M120 150 A60 60 0 0 1 165 105" stroke="#C5A880" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="120" cy="150" r="4" fill="#C5A880"/>
  <text x="110" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F1113">Front Enclosure</text>
  <text x="240" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0F1113">Return Panel</text>
</svg>