<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F9F9F8"/>
  <line x1="30" y1="30" x2="30" y2="170" stroke="#718096" stroke-width="8"/>
  <line x1="270" y1="30" x2="270" y2="170" stroke="#718096" stroke-width="8"/>
  <!-- Top overhead track -->
  <line x1="30" y1="70" x2="270" y2="70" stroke="#C5A880" stroke-width="3"/>
  <!-- Rollers -->
  <circle cx="160" cy="70" r="6" fill="#0F1113" stroke="#C5A880" stroke-width="2"/>
  <circle cx="220" cy="70" r="6" fill="#0F1113" stroke="#C5A880" stroke-width="2"/>
  <!-- Fixed Panel -->
  <line x1="30" y1="95" x2="145" y2="95" stroke="#0F1113" stroke-width="4"/>
  <text x="85" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#718096">Fixed Glass</text>
  <!-- Sliding Panel -->
  <line x1="135" y1="85" x2="250" y2="85" stroke="#0F1113" stroke-width="4"/>
  <!-- Slide motion arrows -->
  <line x1="160" y1="120" x2="220" y2="120" stroke="#C5A880" stroke-width="2"/>
  <polygon points="160,117 154,120 160,123" fill="#C5A880"/>
  <polygon points="220,117 226,120 220,123" fill="#C5A880"/>
  <text x="190" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#C5A880">Smooth Gliding Motion</text>
  <text x="150" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#718096">Soft-Close Dampers Included</text>
</svg>