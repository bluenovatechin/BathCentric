<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F9F9F8"/>
  <!-- Wall profile -->
  <line x1="40" y1="30" x2="40" y2="170" stroke="#718096" stroke-width="8" stroke-linecap="square"/>
  <text x="32" y="22" font-family="sans-serif" font-size="10" fill="#718096" font-weight="600">WALL</text>
  <!-- Floor line -->
  <line x1="30" y1="160" x2="270" y2="160" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Fixed Glass Screen -->
  <line x1="40" y1="100" x2="180" y2="100" stroke="#0F1113" stroke-width="4" stroke-linecap="round"/>
  <circle cx="40" cy="100" r="4" fill="#C5A880"/>
  <!-- Stabilizer Bar -->
  <line x1="40" y1="50" x2="180" y2="100" stroke="#C5A880" stroke-width="2" stroke-dasharray="2 2"/>
  <!-- Dimension marker -->
  <line x1="40" y1="130" x2="180" y2="130" stroke="#C5A880" stroke-width="1.5"/>
  <polygon points="40,127 34,130 40,133" fill="#C5A880"/>
  <polygon points="180,127 186,130 180,133" fill="#C5A880"/>
  <text x="110" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#C5A880">Fixed Panel (700 - 1400mm)</text>
  <!-- Open Walkway -->
  <path d="M190 85 C210 85, 230 100, 240 120" stroke="#38A169" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="242,123 234,118 244,113" fill="#38A169"/>
  <text x="210" y="75" font-family="sans-serif" font-size="10" font-weight="600" fill="#38A169">OPEN ENTRY</text>
</svg>