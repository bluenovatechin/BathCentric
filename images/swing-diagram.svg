<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F9F9F8"/>
  <line x1="40" y1="30" x2="40" y2="170" stroke="#718096" stroke-width="8"/>
  <line x1="260" y1="30" x2="260" y2="170" stroke="#718096" stroke-width="8"/>
  <!-- Fixed inline panel -->
  <line x1="40" y1="100" x2="110" y2="100" stroke="#0F1113" stroke-width="4"/>
  <circle cx="110" cy="100" r="5" fill="#C5A880"/>
  <!-- Swing Door open arc -->
  <path d="M110 100 A80 80 0 0 1 170 45" stroke="#C5A880" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Door closed & ajar -->
  <line x1="110" y1="100" x2="190" y2="100" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="110" y1="100" x2="170" y2="45" stroke="#0F1113" stroke-width="4"/>
  <!-- Right fixed panel -->
  <line x1="190" y1="100" x2="260" y2="100" stroke="#0F1113" stroke-width="4"/>
  <text x="150" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#0F1113">90° / 180° Frameless Swing Door</text>
  <text x="150" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#718096">Solid Brass Hinges with Magnetic Water Seal</text>
</svg>