name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Public settings come from repository variables (Settings → Secrets and variables → Actions → Variables)
          BASE_PATH: ${{ vars.BASE_PATH || '/BathCentric/' }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://bluenovatechin.github.io/BathCentric' }}
          VITE_PHONE: ${{ vars.VITE_PHONE }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
          VITE_EMAIL: ${{ vars.VITE_EMAIL }}
          VITE_ADDRESS: ${{ vars.VITE_ADDRESS }}
          VITE_SERVICE_AREA: ${{ vars.VITE_SERVICE_AREA }}
          VITE_HOURS: ${{ vars.VITE_HOURS }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
      - name: Check links
        run: npm run check:links
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/BathCentric/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v4
