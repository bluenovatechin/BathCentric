<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BATHCENTRIC</title>
  <script>
    // GitHub Pages SPA 404 handler: redirects to HashRouter route
    (function () {
      var repoName = 'BathCentric';
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      if (pathSegments.length > 0 && pathSegments[0].toLowerCase() === repoName.toLowerCase()) {
        pathSegments.shift();
      }
      var targetPath = '/' + pathSegments.join('/') + window.location.search + window.location.hash;
      window.location.replace('/' + repoName + '/#' + (targetPath === '/' ? '' : targetPath));
    })();
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px; color: #555;">Redirecting to BathCentric...</p>
</body>
</html>
